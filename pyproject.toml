[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fitrank"
dynamic = ["version"]
description = "Train, compare and rank scikit-learn models from a single YAML config."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Faïd Adéshinan ALAGBE" }]
keywords = ["machine-learning", "scikit-learn", "model-selection", "automl", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "joblib>=1.3",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "openpyxl>=3.1",   # test the Excel reader
    "pyarrow>=14.0",   # test the Parquet reader
    "pandas-stubs",
    "types-PyYAML",
    "build",
    "twine",
]

[project.scripts]
fitrank = "fitrank.cli:app"

[project.urls]
Homepage = "https://github.com/Adeshinan/fitrank"
Repository = "https://github.com/Adeshinan/fitrank"
Issues = "https://github.com/Adeshinan/fitrank/issues"

[tool.hatch.version]
path = "src/fitrank/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fitrank"]

[tool.hatch.build.targets.sdist]
include = ["src/fitrank", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "N803", # scikit-learn convention: argument names X, X_train
    "N806", # scikit-learn convention: variable names X, X_train
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: runs the installed fitrank command in a new process (slow)"]

[tool.coverage.run]
source = ["fitrank"]
branch = true
