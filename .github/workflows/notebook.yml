name: Notebook

# Runs the notebooks of examples/ from top to bottom with the FitRank of this
# commit. Called by the release workflow before publishing, and runnable by hand
# from the Actions tab. Not on every PR: they download data (seaborn's Titanic,
# UCI's Dry Bean) and take a few minutes.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  notebook:
    name: Run ${{ matrix.notebook }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        notebook: [try_fitrank.ipynb, label_noise_demo.ipynb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # FitRank from this commit: the notebook's "%pip install fitrank" finds it installed.
        run: python -m pip install . seaborn nbclient nbformat ipykernel
      - name: Execute the notebook
        working-directory: examples
        run: |
          NOTEBOOK=${{ matrix.notebook }} python - <<'EOF'
          import os

          import nbformat
          from nbclient import NotebookClient

          notebook = nbformat.read(os.environ["NOTEBOOK"], as_version=4)
          NotebookClient(notebook, timeout=900, kernel_name="python3").execute()
          errors = [
              output
              for cell in notebook.cells
              for output in cell.get("outputs", [])
              if output.get("output_type") == "error"
          ]
          assert not errors, errors
          print(f"{len(notebook.cells)} cells executed without error")
          EOF
