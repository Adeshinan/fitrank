name: Release

# Publishes the package when a version tag is pushed (Trusted Publishing, no token):
# - v1.2.3rc1 (release candidate): TestPyPI, to rehearse the release;
# - v1.2.3: PyPI, then a GitHub release with the CHANGELOG section of that version.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag against __version__
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%rc*}"
          declared=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fitrank/__init__.py)
          if [ "$base" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = \"$declared\" in src/fitrank/__init__.py"
            exit 1
          fi
          if [ "$tag" != "$base" ]; then
            # A release candidate is built under the tag's version, e.g. 1.0.0rc1.
            sed -i "s/^__version__ = .*/__version__ = \"$tag\"/" src/fitrank/__init__.py
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building fitrank $tag"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.candidate == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          # The lines between "## [1.2.3]" and the next "## [" heading.
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "FitRank ${GITHUB_REF_NAME#v}" --notes-file notes.md
