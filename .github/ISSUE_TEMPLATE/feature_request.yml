name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: The situation you are in and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could look, for example the YAML you would like to write.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other tools that do it.
  - type: checkboxes
    id: principles
    attributes:
      label: FitRank principles
      options:
        - label: The feature keeps preprocessing explicit (nothing is applied unless declared).
          required: true
